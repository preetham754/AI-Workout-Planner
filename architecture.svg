<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
  </defs>

  <rect width="900" height="320" fill="#ffffff"/>

  <!-- Step 1: User input -->
  <rect x="20" y="120" width="140" height="80" rx="10" fill="#FFF3F3" stroke="#FF4B4B" stroke-width="2"/>
  <text x="90" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">User Input</text>
  <text x="90" y="170" text-anchor="middle" font-size="11" fill="#666">goal, level,</text>
  <text x="90" y="184" text-anchor="middle" font-size="11" fill="#666">equipment, days</text>

  <line x1="160" y1="160" x2="205" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Retriever -->
  <rect x="210" y="110" width="160" height="100" rx="10" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="290" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Retriever</text>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#666">filters exercise DB by</text>
  <text x="290" y="174" text-anchor="middle" font-size="11" fill="#666">equipment + level + goal</text>
  <text x="290" y="194" text-anchor="middle" font-size="10" fill="#999" font-style="italic">(rule-based, no LLM)</text>

  <!-- Data source feeding retriever -->
  <rect x="230" y="10" width="120" height="60" rx="8" fill="#F5F5F5" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="290" y="35" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">exercises.json</text>
  <text x="290" y="50" text-anchor="middle" font-size="10" fill="#888">35 real exercises</text>
  <line x1="290" y1="70" x2="290" y2="108" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <line x1="370" y1="160" x2="415" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Prompt builder -->
  <rect x="420" y="110" width="160" height="100" rx="10" fill="#F5F0FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Prompt Builder</text>
  <text x="500" y="160" text-anchor="middle" font-size="11" fill="#666">grounds the model in</text>
  <text x="500" y="174" text-anchor="middle" font-size="11" fill="#666">ONLY matched exercises</text>

  <line x1="580" y1="160" x2="625" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Ollama / LLM -->
  <rect x="630" y="105" width="160" height="110" rx="10" fill="#F0FFF4" stroke="#22C55E" stroke-width="2"/>
  <text x="710" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Ollama</text>
  <text x="710" y="153" text-anchor="middle" font-size="11" fill="#666">Llama 3.2 / Gemma 2</text>
  <text x="710" y="170" text-anchor="middle" font-size="11" fill="#666">runs 100% locally</text>
  <text x="710" y="188" text-anchor="middle" font-size="10" fill="#999" font-style="italic">no cloud calls</text>

  <line x1="710" y1="215" x2="710" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Output -->
  <rect x="600" y="255" width="220" height="55" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="710" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Streamlit UI</text>
  <text x="710" y="296" text-anchor="middle" font-size="11" fill="#666">plan streams in live, word by word</text>
</svg>
